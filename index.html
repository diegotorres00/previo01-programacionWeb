<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Shop Online - Login</title>
	<link rel="stylesheet" href="css/styles.css">
</head>
<body>
	<main class="contenedor">
		<section class="tarjeta" aria-labelledby="titulo-login">
			<h1 id="titulo-login">Shop Online</h1>
			<p class="subtitulo">Inicia sesion para continuar</p>

			<form id="formulario-login">
				<label for="usuario">Usuario</label>
				<input id="usuario" name="usuario" type="text" value="mor_2314" autocomplete="username" required>

				<label for="contrasena">Contraseña</label>
				<div class="campo-contrasena">
					<input id="contrasena" name="contrasena" type="password" value="83r5^_" autocomplete="current-password" required>
					<button id="boton-mostrar" type="button">Mostrar</button>
				</div>

				<button class="boton-entrar" id="boton-entrar" type="submit">Iniciar sesion</button>
				<p id="mensaje" class="mensaje" role="status" aria-live="polite"></p>
			</form>

			<p class="nota">Proyecto de Programacion Web - UFPS</p>
		</section>

		<section class="productos" id="seccion-productos" hidden>
			<header class="encabezado-productos">
				<div>
					<h1>Shop Online</h1>
					<p class="bienvenida">Bienvenido, <span id="nombre-usuario"></span></p>
					<p class="subtitulo">Lista de productos</p>
				</div>
				<div class="acciones">
					<button id="nuevo-carrito" type="button">Nuevo carrito</button>
					<button id="boton-carrito" type="button">Carrito (<span id="cantidad-carrito">0</span>)</button>
					<button id="boton-salir" type="button">Salir</button>
				</div>
			</header>

			<div class="buscador">
				<input id="texto-busqueda" type="search" placeholder="Buscar producto..." aria-label="Buscar producto">
				<button id="boton-buscar" type="button">Buscar</button>
			</div>
			<nav class="categorias" id="lista-categorias" aria-label="Categorias de productos"></nav>
			<p id="mensaje-productos" class="mensaje" role="status" aria-live="polite"></p>
			<div class="lista-productos" id="lista-productos"></div>
		</section>

		<section class="productos carrito" id="seccion-carrito" hidden>
			<header class="encabezado-productos">
				<div>
					<h1>Shop Online</h1>
					<p class="subtitulo">Mis pedidos</p>
				</div>
				<div class="acciones">
					<button id="volver-productos" type="button">Seguir comprando</button>
					<button id="boton-salir-carrito" type="button">Salir</button>
				</div>
			</header>

			<div id="lista-carritos-contenedor">
				<table>
					<thead>
						<tr><th>Numero</th><th>Fecha de solicitud</th><th>Acciones</th></tr>
					</thead>
					<tbody id="tabla-carritos"></tbody>
				</table>
			</div>

			<div id="detalle-pedido" hidden>
				<button class="boton-volver" id="volver-carritos" type="button">Volver a pedidos</button>
				<h2 id="titulo-pedido"></h2>
				<table>
					<thead>
						<tr><th>Concepto</th><th>Cantidad</th><th>Valor</th><th>Subtotal</th></tr>
					</thead>
					<tbody id="tabla-detalle"></tbody>
					<tfoot><tr><th colspan="3">Total</th><th id="total-pedido">$0.00</th></tr></tfoot>
				</table>
				<div class="acciones-pedido">
					<button id="actualizar-pedido" type="button">Actualizar</button>
					<button id="confirmar-pedido" type="button">Confirmar</button>
					<button id="seguir-comprando" type="button">Seguir comprando</button>
				</div>
				<p id="mensaje-carrito" class="mensaje" role="status" aria-live="polite"></p>
			</div>
		</section>
	</main>
	<script src="js/app.js"></script>
</body>
</html>
